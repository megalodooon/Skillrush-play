<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Skillrush</title>
<meta name="description" content="Skillrush — playtest build. Works on phone and desktop.">
<meta name="theme-color" content="#0a0e15">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="game/index.apple-touch-icon.png">
<meta property="og:title" content="Skillrush">
<meta property="og:description" content="Playtest build — tap to play in your browser.">
<meta property="og:type" content="website">
<style>
@font-face{
  font-family:"BoldPixels";
  src:url("BoldPixels.ttf") format("truetype");
  font-display:swap;
}
:root{
  --bg:#0a0e15; --fg:#e2ecf3; --dim:#6b7c8d; --faint:#46525f;
  --accent:#38c6d9; --gold:#e8c46a; --card:#161c26;
  --chrome:96px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none; -webkit-text-size-adjust:100%;
}
#app{
  min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:14px;
}
#bar{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center;
  font-size:13px; color:var(--dim);
}
#bar .title{
  font-family:"BoldPixels",system-ui,sans-serif;
  font-size:22px; letter-spacing:.06em; color:var(--fg);
}
#bar .tag{
  font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--bg); background:var(--accent);
  padding:3px 7px; border-radius:4px;
}
#bar .sep{color:var(--faint)}
button{
  font:inherit; font-size:13px; color:var(--fg);
  background:var(--card); border:1px solid rgba(255,255,255,.10);
  padding:6px 12px; border-radius:6px; cursor:pointer;
}
button:hover{border-color:var(--accent); color:var(--accent)}
#stage{
  position:relative; background:#000; overflow:hidden;
  border-radius:16px; border:1px solid rgba(255,255,255,.09);
  box-shadow:0 24px 60px rgba(0,0,0,.55);
  height:min(calc(100dvh - var(--chrome)), 880px);
  aspect-ratio:360 / 640;
  touch-action:none;
}
#stage iframe{width:100%; height:100%; border:0; display:block; background:#000}
#gate{
  position:absolute; inset:0; z-index:2;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; padding:28px; text-align:center;
  background:radial-gradient(120% 90% at 50% 0%, #16202e 0%, var(--bg) 70%);
}
#gate h1{
  font-family:"BoldPixels",system-ui,sans-serif;
  margin:0; font-size:clamp(34px,10vw,52px); letter-spacing:.05em; line-height:1;
}
#gate h1 span{color:var(--accent)}
#gate p{margin:0; font-size:14px; color:var(--dim); line-height:1.5; max-width:26ch}
#play{
  font-family:"BoldPixels",system-ui,sans-serif;
  font-size:24px; letter-spacing:.08em;
  color:var(--bg); background:var(--accent); border:0;
  padding:14px 42px; border-radius:10px; margin-top:6px;
}
#play:hover{color:var(--bg); background:#5fdcec; border:0}
#meta{font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums}
#loading{
  position:absolute; inset:0; z-index:1; display:none;
  align-items:center; justify-content:center; color:var(--dim); font-size:13px;
}
#stage.booting #loading{display:flex}
#stage:fullscreen, #stage:-webkit-full-screen{
  width:100vw; height:100dvh; max-width:none; aspect-ratio:auto;
  border-radius:0; border:0;
}
/* Phones and small tablets: the game takes the whole screen. */
@media (max-width:700px), (pointer:coarse) and (max-width:1024px){
  #app{padding:0; gap:0}
  #bar{display:none}
  #stage{
    width:100vw; height:100dvh; max-width:none;
    aspect-ratio:auto; border-radius:0; border:0; box-shadow:none;
  }
}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span class="title">SKILLRUSH</span>
    <span class="tag">playtest</span>
    <span class="sep">|</span>
    <span id="meta-desktop"></span>
    <button id="fs" type="button">Fullscreen</button>
    <button id="reload" type="button">Get latest build</button>
  </div>

  <main id="stage">
    <div id="loading">loading…</div>
    <div id="gate">
      <h1>SKILL<span>RUSH</span></h1>
      <p>A playtest build. Tap Play to load it — it runs right here in the browser, no install.</p>
      <button id="play" type="button">PLAY</button>
      <p id="meta"></p>
    </div>
  </main>
</div>

<script>
(function () {
  var BUILD_SHA  = "21d21bc";
  var BUILD_DATE = "2026-09-06 17:33 UTC";

  var stage   = document.getElementById("stage");
  var gate    = document.getElementById("gate");
  var play    = document.getElementById("play");
  var fsBtn   = document.getElementById("fs");
  var reload  = document.getElementById("reload");

  var metaText = "build " + BUILD_SHA + " · " + BUILD_DATE;
  document.getElementById("meta").textContent = metaText;
  document.getElementById("meta-desktop").textContent = metaText;

  var isTouch = window.matchMedia("(pointer:coarse)").matches;

  function start() {
    if (stage.querySelector("iframe")) return;
    gate.remove();
    stage.classList.add("booting");

    var frame = document.createElement("iframe");
    frame.title = "Skillrush";
    frame.src = "game/index.html?v=" + encodeURIComponent(BUILD_SHA);
    frame.allow = "fullscreen; autoplay; gamepad; accelerometer; screen-wake-lock";
    frame.setAttribute("allowfullscreen", "");
    frame.addEventListener("load", function () {
      stage.classList.remove("booting");
      try { frame.contentWindow.focus(); } catch (e) {}
    });
    stage.appendChild(frame);

    if (isTouch) requestFullscreen();
  }

  function requestFullscreen() {
    var fn = stage.requestFullscreen || stage.webkitRequestFullscreen;
    if (!fn) return;            // iOS Safari: the page already fills the screen
    try {
      var r = fn.call(stage);
      if (r && r.catch) r.catch(function () {});
    } catch (e) {}
  }

  play.addEventListener("click", start);

  fsBtn.addEventListener("click", function () {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      requestFullscreen();
    }
  });

  reload.addEventListener("click", function () {
    location.reload();
  });

  // Keyboard input has to reach the game, not the page around it.
  window.addEventListener("click", function () {
    var frame = stage.querySelector("iframe");
    if (frame) { try { frame.contentWindow.focus(); } catch (e) {} }
  });

  // Stop the page itself from scrolling or pinch-zooming under the game.
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("touchmove", function (e) {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  // ---------------------------------------------------------------------
  // Safe area.
  //
  // Added to a home screen the page runs fullscreen with the status bar and
  // the home indicator drawn OVER it, and viewport-fit=cover is what asks for
  // that. env(safe-area-inset-*) says how much is covered -- but ONLY in the
  // top-level document. An iframe is never told, and the game is in an iframe,
  // so without this the settings gear sits under the clock and the nav row
  // sits under the home indicator.
  //
  // The probe reads the four insets off a real element (env() is only valid in
  // a property value, so it cannot simply be read off a variable), and the game
  // picks them up through window.parent.__skillrushInsets. See
  // godot/core/screen.gd, which is the other half of this.
  var probe = document.createElement("div");
  probe.style.cssText =
    "position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;" +
    "padding-left:env(safe-area-inset-left,0px);padding-top:env(safe-area-inset-top,0px);" +
    "padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)";
  document.body.appendChild(probe);

  function readInsets() {
    var s = getComputedStyle(probe);
    window.__skillrushInsets = [
      parseFloat(s.paddingLeft)   || 0,
      parseFloat(s.paddingTop)    || 0,
      parseFloat(s.paddingRight)  || 0,
      parseFloat(s.paddingBottom) || 0
    ];
  }

  // ---------------------------------------------------------------------
  // Stale build check.
  //
  // This page embeds the SHA it was built from and loads the game as
  // game/index.html?v=SHA, so the GAME is cache-busted by construction. This
  // page is not. Added to a home screen it is a standalone app whose HTML the
  // browser is entitled to hold for as long as it likes -- so a phone can go on
  // launching a months-old build, loading the months-old game the old SHA
  // points at, while the site has moved on. Every "it still does the old thing
  // on my phone" starts here.
  //
  // version.txt is written by the publish workflow and fetched with no-store,
  // so it is always the live answer. Differ, and this reloads once -- guarded
  // by sessionStorage, because a reload that finds the same mismatch again
  // would be a loop.
  fetch("version.txt", { cache: "no-store" })
    .then(function (r) { return r.ok ? r.text() : ""; })
    .then(function (live) {
      live = (live || "").trim();
      if (!live || live === BUILD_SHA) return;
      try {
        if (sessionStorage.getItem("sr-reloaded") === live) return;
        sessionStorage.setItem("sr-reloaded", live);
      } catch (e) {}
      location.reload();
    })
    .catch(function () {});

  readInsets();
  // Rotating, or the browser's own chrome sliding away, both move them.
  window.addEventListener("resize", readInsets);
  window.addEventListener("orientationchange", function () {
    setTimeout(readInsets, 250);
  });
})();
</script>
</body>
</html>
