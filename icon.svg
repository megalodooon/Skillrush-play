<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Drawn on a 64x64 grid with square corners so it stays on-brand with the
       pixel art inside the game, and as an SVG so one file covers every size a
       launcher asks for. -->
  <rect width="64" height="64" fill="#0a0e15"/>
  <rect x="4" y="4" width="56" height="56" fill="none" stroke="#1b2531" stroke-width="2"/>
  <!-- Bolt: skill, and the rush of it. -->
  <path fill="#38c6d9" d="M36 8h14L34 28h12L22 56l6-20H16z"/>
  <!-- Speed marks trailing it. -->
  <rect x="8"  y="20" width="10" height="3" fill="#1f6f7d"/>
  <rect x="10" y="27" width="7"  height="3" fill="#175662"/>
  <rect x="46" y="41" width="10" height="3" fill="#1f6f7d"/>
  <rect x="48" y="34" width="7"  height="3" fill="#175662"/>
</svg>
